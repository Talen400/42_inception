[adminer]
user = nobody
group = nobody
listen = 0.0.0.0:${ADMINER_PORT}
listen.owner = nobody
listen.group = nobody

pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s

chdir = /var/www/adminer

clear_env = no
security.limit_extensions = .php

access.log = /proc/self/fd/2
catch_workers_output = yes
