# version: '3.8'

services:
  ngnix:
    build: requirements/nginx
    image: ngnix:inception
    container_name: nginx
    ports:
      - "${WEB_PORT}:${WEB_PORT}"
    environment:
      - NGINX_HOST=${DOMAIN_NAME}
      - NGINX_PORT=${WEB_PORT}
    env_file:
      .env
    networks:
      - inception_network

  mariadb:
    build: requirements/mariadb
    image: mariadb:inception
    container_name: mariadb
    ports:
      - "8080:8080"
    env_file:
      - .env
    secrets:
      - db_name
      - db_user
      - db_password
      - db_root_password
    networks:
      - inception_network
    volumes:
      - ${VOLUME_MARIADB}:/mariadb


secrets:
  db_name:
    file: ../secrets/db_name
  db_password:
    file: ../secrets/db_password
  db_root_password:
    file: ../secrets/db_root_password
  db_user:
    file: ../secrets/db_user

networks:
  inception_network:
    driver: bridge
